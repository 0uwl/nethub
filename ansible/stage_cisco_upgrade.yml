---
- name: IOSXE Staging Preview
  hosts: upgrade_batch
  gather_facts: false
  tasks:
    - name: Resolve target bundle for {{ inventory_hostname }}
      tags: pre-check, dry-run
      ansible.builtin.include_tasks: tasks/resolve_target_bundle.yml

    - name: Initialize staging result tracking for {{ inventory_hostname }}
      tags: pre-check, image-copy
      ansible.builtin.set_fact:
        staging_result:
          success: false
          status: "not_copied"
          reason: "Staging not started"
          message: "No message"

    - name: Print upgrade plan for all targeted hosts
      tags: pre-check, dry-run
      run_once: true  # no serial so it always covers every targeted host in one pass
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "copy image {{ hostvars[item].target_bundle.file_name | default('UNDEFINED') }} -> {{ item }}"
      loop: "{{ ansible_play_batch }}"
      loop_control:
        label: "{{ item }}"

    - name: Continue the image staging process for these hosts?
      tags: pre-check
      ansible.builtin.pause:
        prompt: "Press enter to continue or ctrl-c + a to abort"

- name: IOSXE Image Staging
  hosts: upgrade_batch
  gather_facts: false
  connection: network_cli

  # Set stage_serial to >1 (-e stage_serial=N) to run against multiple hosts at once
  serial: "{{ stage_serial | default(1) }}"

  tasks:
    - name: List files in {{ inventory_hostname }}
      tags: pre-check, image-check, image-copy
      cisco.ios.ios_command:
        commands: "dir {{ flash_dir }}"
      register: image_check

    - name: Set files check as fact
      tags: pre-check, image-check, image-copy
      ansible.builtin.set_fact:
        dir_image_check: "{{ image_check.stdout[0] | regex_search(image_var, multiline=True) }}"
      vars:
        image_var: "{{ target_image }}"

    - name: Skip staging if image is already present
      when: dir_image_check == target_image
      block:
      - name: Set staging result as skipped
        tags: image-copy, pre-check
        ansible.builtin.set_fact:
          staging_result:
            success: True
            status: "skipped"
            reason: "Image is already present on host"
            message: "No message"

      - name: Stop play for host {{ inventory_hostname }}
        tags: image-copy, enable-scp
        ansible.builtin.meta: end_host


    - name: Stage image
      block:
        - name: Set timestamp
          ansible.builtin.set_fact:
            timestamp: "{{ lookup('pipe', 'date \"+%Y-%m-%d-%H-%M\"') }}"

        - name: Collect device facts
          tags: pre-check, image-copy
          ansible.builtin.include_tasks: "tasks/collect_iosxe_facts.yml"

        - name: Backing up config for {{ inventory_hostname }} to {{ config_backup_dir | default('./backup') }}
          tags: backup, image-copy, install
          cisco.ios.ios_config:
            backup: true
            backup_options:
              filename: "{{ inventory_hostname }}_backup_{{ timestamp }}.cfg"
              dir_path: "{{ config_backup_dir | default('./backup') }}"
          register: config_output

        - name: Check available disk space for {{ inventory_hostname }}
          tags: pre-check, image-copy
          ansible.builtin.include_tasks: tasks/check_disk_space.yml

        - name: Stage target image on {{ inventory_hostname }}
          tags: image-copy
          ansible.builtin.include_tasks: tasks/stage_image.yml

      always:
          - name: Restore SCP server to its prior state
            tags: image-copy, install
            cisco.ios.ios_config:
              lines:
                - "{{ 'ip scp server enable' if scp_server_prior_enabled | default(false) else 'no ip scp server enable' }}"
            register: scp_server_restore
            failed_when: false
            when: scp_server_prior_enabled is defined

          - name: Read back SCP server state
            tags: image-copy, install
            cisco.ios.ios_command:
              commands: 'show running-config | include ^ip scp server'
            register: scp_server_after
            failed_when: false
            when: scp_server_prior_enabled is defined

          - name: Record whether the restore was confirmed
            tags: image-copy, install
            ansible.builtin.set_fact:
              scp_restore_confirmed: >-
                {{ (scp_server_prior_enabled is not defined)
                   or (('ip scp server enable' in (scp_server_after.stdout[0] | default('')))
                       == (scp_server_prior_enabled | bool)) }}

          - name: Warn loudly if the device was not put back
            tags: image-copy, install
            ansible.builtin.debug:
              msg: >-
                WARNING: {{ inventory_hostname }} SCP server state was NOT
                restored. This device has been changed and not changed back.
                Fix it by hand
            when: not (scp_restore_confirmed | bool)

- name: IOSXE Staging Summary
  hosts: upgrade_batch
  gather_facts: false
  tasks:
    - name: Build per-host status map
      tags: post-check, image-copy
      run_once: true
      delegate_to: localhost
      ansible.builtin.set_fact:
        staging_report: "{{ staging_report | default([]) + [ {
          'host': item,
          'success': hostvars[item].staging_result.success,
          'status': hostvars[item].staging_result.status,
          'reason': hostvars[item].staging_result.reason,
          'message': hostvars[item].staging_result.message
         } ] }}"
      loop: "{{ ansible_play_batch }}"

    - name: Print batch summary
      tags: post-check, image-copy
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg:
          - "Host: {{ item.host }}"
          - "Success: {{ item.success }}"
          - "Status: {{ item.status }}"
          - "Reason: {{ item.reason }}"
          - "Message: {{ item.message }}"
      loop: "{{ staging_report }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Fail the run if any host in the batch failed
      tags: post-check, image-copy
      run_once: true
      delegate_to: localhost
      vars:
        failed_hosts: "{{ staging_report | selectattr('success', 'equalto', false) | list }}"
      ansible.builtin.fail:
        msg: >-
          {{ failed_hosts | length }} of {{ ansible_play_batch | length }} host(s)
          did not complete successfully: {{ failed_hosts }}
      when: failed_hosts | length > 0
