---
ansible_user: ansible

## How the image reaches the device (design doc 3.3, 4.3.1). Deployment-level:
## NetHub renders this from the settings table, and an upgrade request may not
## set it -- choosing the transport chooses which credential is used.
##
##   push_scp   NetHub writes the image to the device with net_put over SCP,
##              under the submitter's own device credential. No distribution
##              account exists. Enables and restores the device's own SCP
##              server for the duration of the push.
##   pull_sftp  The device fetches the image from the distribution host.
##              Leaves device config untouched, but needs an SFTP daemon the
##              device can reach outbound and a credential for it, and the
##              device does not verify the daemon's host key.
image_transport: push_scp

## Read only under pull_sftp, and rendered only then. The daemon must expose
## the published subtree at the same path software_registry.search_dir names;
## there is deliberately no second per-artifact directory variable.
# distribution_host: images.example.net
# distribution_user: nethub-dist

## distribution_password is never rendered here. Under
## distribution_credential_source = same_as_device it is the submitter's own
## device credential, already in memory; under = dedicated it is a systemd
## credential the sibling reads. Either way it is injected per execution
## (design doc 9.1) and lives on tmpfs for the life of that execution only.
## For a hand run, export DISTRIBUTION_PASSWORD.

## No ansible_become / ansible_become_method. NetHub requires privilege 15 at
## login (design doc 4.3), so there is no escalation step and no
## become_password to collect.
