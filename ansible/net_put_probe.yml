---
## Standalone diagnostic. NOT part of the upgrade flow.
##
## Answers one question the design cannot settle on paper: is
## ansible.netcommon.net_put usable against IOS-XE for image-sized files?
##
## Background (design doc 4.3.1, 10):
##   - net_put's SCP path is reported broken against IOS-XE under the
##     libssh connection type (pylibssh #673, ssh_scp_init failure).
##   - The paramiko alternative works but is deprecated in
##     ansible.netcommon, slated for removal after 2028-02-01.
##   - SFTP is NOT an option in this direction: IOS-XE has no SFTP
##     server, only a client. So SCP is the only wire protocol available
##     for a push, which is exactly the path reported broken.
##
## If this probe fails or is unusably slow under both ssh_types, the
## fallback is to invoke OpenSSH scp from inside the EE instead.
##
## Run it twice, once per connection type:
##
##   ansible-playbook ansible/net_put_probe.yml \
##     -i <inventory> -l <one-host> \
##     -e probe_src=/path/to/real-sized-image.bin \
##     -e ansible_network_cli_ssh_type=libssh
##
##   ansible-playbook ansible/net_put_probe.yml ... \
##     -e ansible_network_cli_ssh_type=paramiko
##
## Use a REAL image-sized file (400MB+). A 1MB test file will succeed
## under conditions a 500MB file fails in, and tells you nothing about
## throughput.
##
## SAFETY: this enables the device's SCP server if it is not already on,
## and restores whatever it found in an always: block. It does not
## write to startup-config. Read the restore section before running it
## against anything you care about.

- name: net_put probe against IOS-XE
  hosts: all
  gather_facts: false
  connection: network_cli

  vars:
    probe_src: ''                     # required: local file to push
    probe_flash_dir: 'flash:'
    probe_dest_name: "{{ probe_src | basename }}"
    probe_keep: false                 # true = leave the file on the device

  tasks:
    - name: Fail early unless probe_src was supplied
      ansible.builtin.assert:
        quiet: false
        fail_msg: 'Pass -e probe_src=/path/to/file (use a real image-sized file).'
        that:
          - probe_src | length > 0
      delegate_to: localhost

    - name: Stat the local source file
      ansible.builtin.stat:
        path: "{{ probe_src }}"
        checksum_algorithm: sha512
      delegate_to: localhost
      register: probe_local

    - name: Fail unless the source file exists
      ansible.builtin.assert:
        quiet: false
        fail_msg: "{{ probe_src }} not found on the controller."
        that:
          - probe_local.stat.exists
      delegate_to: localhost

    - name: Report what is about to be pushed
      ansible.builtin.debug:
        msg: >-
          Pushing {{ probe_src }} ({{ probe_local.stat.size }} bytes)
          to {{ inventory_hostname }}:{{ probe_flash_dir }}{{ probe_dest_name }}
          via net_put, ssh_type={{ ansible_network_cli_ssh_type | default('(default)') }}

    ## --- preconditions -------------------------------------------------

    - name: Read current privilege level
      cisco.ios.ios_command:
        commands: 'show privilege'
      register: probe_privilege

    - name: Fail unless the session is privilege 15
      ansible.builtin.assert:
        quiet: false
        fail_msg: >-
          Session is not at privilege level 15. The IOS-XE SCP server
          authorizes at exec-authorization time and does not consult
          enable, so a push cannot work below 15.
        that:
          - "'level is 15' in probe_privilege.stdout[0]"

    - name: Read prior SCP server state
      cisco.ios.ios_command:
        commands: 'show running-config | include ^ip scp server'
      register: probe_scp_prior

    - name: Record whether the SCP server was already enabled
      ansible.builtin.set_fact:
        probe_scp_was_enabled: "{{ 'ip scp server enable' in probe_scp_prior.stdout[0] }}"

    - name: Report prior SCP server state
      ansible.builtin.debug:
        msg: >-
          SCP server was {{ 'ALREADY ENABLED (will be left enabled)'
          if probe_scp_was_enabled else 'disabled (will be re-disabled)' }}

    ## --- the probe itself ----------------------------------------------

    - name: Enable SCP server and push
      block:
        - name: Enable the device SCP server
          cisco.ios.ios_config:
            lines:
              - 'ip scp server enable'
          when: not probe_scp_was_enabled

        - name: Mark transfer start
          ansible.builtin.set_fact:
            probe_t0: "{{ lookup('pipe', 'date +%s') | int }}"

        ## THE THING UNDER TEST.
        ## If this is what fails, the fallback is OpenSSH scp invoked from
        ## inside the EE against a rendered known_hosts -- see design doc 10.
        - name: Push the file via net_put
          ansible.netcommon.net_put:
            src: "{{ probe_src }}"
            dest: "{{ probe_flash_dir }}{{ probe_dest_name }}"
            protocol: scp
          vars:
            ansible_command_timeout: 10000
          register: probe_put

        - name: Mark transfer end
          ansible.builtin.set_fact:
            probe_t1: "{{ lookup('pipe', 'date +%s') | int }}"

        - name: Report throughput
          ansible.builtin.debug:
            msg: >-
              Transferred {{ probe_local.stat.size }} bytes in
              {{ (probe_t1 | int) - (probe_t0 | int) }}s
              ({{ ((probe_local.stat.size | int)
                   / (((probe_t1 | int) - (probe_t0 | int)) | max(1))
                   / 1048576) | round(2) }} MB/s)

        ## Independent confirmation that the bytes arrived intact. The
        ## module's exit status is not evidence -- this is.
        - name: Verify the pushed image on the device
          cisco.ios.ios_command:
            commands:
              - "verify /sha512 {{ probe_flash_dir }}{{ probe_dest_name }} {{ probe_local.stat.checksum }}"
            wait_for:
              - result[0] contains Verified
          vars:
            ansible_command_timeout: 600
          register: probe_verify

        - name: Report verification result
          ansible.builtin.debug:
            msg: 'SHA-512 verified on device.'

      rescue:
        - name: Report probe failure
          ansible.builtin.debug:
            msg: >-
              PROBE FAILED under
              ssh_type={{ ansible_network_cli_ssh_type | default('(default)') }}.
              See the error above. If this is ssh_scp_init / "Socket error:
              No such file or directory", it is pylibssh #673 -- re-run with
              -e ansible_network_cli_ssh_type=paramiko.

        - name: Flag the failure
          ansible.builtin.set_fact:
            probe_failed: true

      ## Runs whether the push succeeded, failed, or was interrupted here.
      ## This is the compensating action design doc 4.3.1 calls
      ## load-bearing: a probe that leaves the SCP server enabled is the
      ## residue problem in miniature.
      always:
        - name: Restore SCP server to its prior state
          cisco.ios.ios_config:
            lines:
              - "{{ 'ip scp server enable' if probe_scp_was_enabled else 'no ip scp server enable' }}"
          register: probe_restore
          failed_when: false

        - name: Read back SCP server state
          cisco.ios.ios_command:
            commands: 'show running-config | include ^ip scp server'
          register: probe_scp_after
          failed_when: false

        - name: Report restore outcome
          ansible.builtin.debug:
            msg: >-
              {{ 'SCP server state RESTORED as found.'
                 if (('ip scp server enable' in (probe_scp_after.stdout[0] | default('')))
                     == (probe_scp_was_enabled | bool))
                 else 'WARNING: SCP server state NOT restored -- fix this device by hand.' }}

        - name: Remove the pushed file unless probe_keep was set
          cisco.ios.ios_command:
            commands:
              - command: "delete /force {{ probe_flash_dir }}{{ probe_dest_name }}"
          when: not (probe_keep | bool)
          failed_when: false

    - name: Fail the host if the probe failed
      ansible.builtin.fail:
        msg: 'net_put probe failed -- see output above.'
      when: probe_failed | default(false)
