---
- name: IOSXE Upgrade Preview
  hosts: upgrade_batch
  gather_facts: false
  connection: network_cli
  tasks:
    - name: Resolve target bundle
      tags: install, dry-run
      ansible.builtin.include_tasks: tasks/resolve_target_bundle.yml

    - name: Print upgrade plan for all targeted hosts
      tags: pre-check, dry-run
      run_once: true  # no serial so it always covers every targeted host in one pass
      delegate_to: localhost
      ansible.builtin.debug:
        msg: >-
          upgrade {{ item }} to target version
          {{ hostvars[item].target_bundle.version | default('UNDEFINED (set software_bundle for this host)') }},
          image {{ hostvars[item].target_bundle.file_name | default('UNDEFINED') }}
      loop: "{{ ansible_play_hosts_all }}"
      loop_control:
        label: "{{ item }}"

    - name: Continue the upgrade process for these hosts?
      tags: pre-check, preview
      ansible.builtin.pause:
        prompt: "Press enter to continue or ctrl-c + a to abort"


- name: IOSXE Image Activation
  hosts: upgrade_batch
  gather_facts: false
  connection: network_cli

  # Set upgrade_serial to >1 (-e install_serial=N) to run against multiple hosts at once
  serial: "{{ install_serial | default(1) }}"
  tasks:
    - name: Set timestamp
      ansible.builtin.set_fact:
        timestamp: "{{ lookup('pipe', 'date \"+%Y-%m-%d-%H-%M\"') }}"

    - name: Collect device facts
      tags: pre-check, image-copy
      ansible.builtin.include_tasks: "tasks/collect_iosxe_facts.yml"

    - name: List files in {{ flash_dir }}
      tags: pre-check, image-check, image-copy
      cisco.ios.ios_command:
        commands: "dir {{ flash_dir }}"
      register: image_check

    - name: Set files check as fact
      tags: pre-check, image-check, image-copy
      ansible.builtin.set_fact:
        dir_image_check: "{{ image_check.stdout[0] | regex_search(image_var, multiline=True) }}"
      vars:
        image_var: "{{ target_image }}"

    - name: Abort if image is not staged present
      when: dir_image_check != target_image
      block:
      - name: Set staging result as skipped
        tags: image-copy, pre-check
        ansible.builtin.set_fact:
          install_result:
            success: False
            status: "image_missing"
            message: "Image is not staged on host"
            current_version: "{{ ansible_facts['net_version'] }}"
            target_version: "{{ target_version }}"

      - name: Stop play for host
        tags: image-copy, enable-scp
        ansible.builtin.meta: end_host

    - name: Backing up config to {{ config_backup_dir | default('./backup') }}
      tags: backup, image-copy, install
      cisco.ios.ios_config:
        backup: true
        backup_options:
          filename: "{{ inventory_hostname }}_backup_{{ timestamp }}.cfg"
          dir_path: "{{ config_backup_dir | default('./backup') }}"
      register: config_output

    - name: Set fact for the current IOSXE version
      tags: pre-check, post-check, image-copy
      ansible.builtin.set_fact:
        current_version: "{{ ansible_facts['net_version'] }}"

    - name: Print parsed output for the current IOSXE version
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} is currently running on {{ current_version }}"

    - name: Initialize upgrade result tracking
      tags: pre-check
      ansible.builtin.set_fact:
        install_result:
          success: False
          status: "not_started"
          message: "Installation process not started"
          current_version: "{{ current_version }}"
          target_version: "{{ target_version }}"

    - name: Assert that switch is NOT running with the target IOSXE version
      tags: pre-check, image-copy
      ansible.builtin.assert:
        that:
          - "current_version != target_version"
        quiet: false
        success_msg: "{{ inventory_hostname }} not running target verion {{ target_version }}, current version is {{ current_version }}"
        fail_msg: "{{ inventory_hostname }} already running {{ target_version }}"

    - name: Install IOSXE Software
      block:
        - name: Saving configuration before upgrading
          tags: install
          cisco.ios.ios_command:
            commands:
              - 'write memory'

        - name: Installing Target IOSXE {{ target_version }}
          tags: install
          cisco.ios.ios_command:
            commands:
              - command: 'install add file {{ flash_dir }}{{ target_image }} activate commit prompt-level none'
          register: install_output
          vars:
            ansible_command_timeout: 1800

        - name: Wait for connectivity to return
          tags: install
          ansible.builtin.wait_for_connection:
            delay: 60
            sleep: 30
            timeout: 900

      rescue:
        - name: Catch installation errors
          tags: install
          ansible.builtin.set_fact:
            install_result:
              success: False
              status: "install_failed"
              message: "Install command failed"
              current_version: "{{ current_version }}"
              target_version: "{{ current_version }}"
              reason: "{{ ansible_failed_reason.msg }}"

        - name: End play for this host
          ansible.builtin.meta: end_host

      always:
        - name: Print Install Results
          tags: install
          ansible.builtin.debug:
            var: install_output.stdout_lines

        - name: Gather post-upgrade facts for {{ inventory_hostname }}
          tags: post-check, install
          cisco.ios.ios_facts:

        - name: "Assert switch is running the target IOSXE version after upgrade: {{ target_version }}"
          tags: post-check, install, upgrade
          ansible.builtin.assert:
            quiet: false
            success_msg: "{{ inventory_hostname }} has been upgraded to {{ ansible_net_version }}"
            fail_msg: "Failed to upgrade the {{ inventory_hostname }}, still runninng {{ ansible_net_version }}"
            that:
              - "ansible_net_version == target_version"

        - name: Post-install clean-up
          tags: install, cleanup
          block:
            - name: Issue cleanup command
              cisco.ios.ios_command:
                commands:
                  - command: install remove inactive
                    prompt: Do you want to remove the above files?
                    answer: 'y'
                wait_for:
                  - result[0] contains SUCCESS
              register: cleanup_output
              vars:
                ansible_command_timeout: 300

            - name: Print Cleanup Results
              tags: install, cleanup, upgrade
              ansible.builtin.debug:
                var: cleanup_output.stdout_lines

          rescue:
            - name: Catch clean-up errors
              ansible.builtin.set_fact:
                install_result:
                  success: False
                  status: "not_clean"
                  message: "Post-installation clean-up failedl"
                  reason: "{{ ansible_failed_reason.msg }}"
                  current_version: "{{ ansible_facts['net_version'] }}"
                  target_version: "{{ target_version }}"

            - name: Stop play for this host
              ansible.builtin.meta: end_host

        - name: Upgrade completed
          tags: install
          ansible.builtin.set_fact:
            install_result:
              success: True
              status: "software_installed"
              message: "Installation successful"
              current_version: "{{ ansible_facts['net_version'] }}"
              target_version: "{{ target_version }}"
          when: ansible_net_version == target_version


- name: IOSXE Upgrade Summary
  hosts: upgrade_batch
  gather_facts: false
  tasks:
    - name: Build per-host status map
      tags: post-check, install
      run_once: true
      delegate_to: localhost
      ansible.builtin.set_fact:
        install_report: "{{ install_report | default([]) + [ {
          'host': item,
          'success': hostvars[item].install_result.success,
          'status': hostvars[item].install_result.status,
          'reason': hostvars[item].install_result.reason,
          'message': hostvars[item].install_result.message
         } ] }}"
      loop: "{{ ansible_play_batch }}"

    - name: Print batch summary
      tags: post-check, install
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg:
          - "Host: {{ item.host }}"
          - "Success: {{ item.success }}"
          - "Status: {{ item.status }}"
          - "Reason: {{ item.reason }}"
          - "Message: {{ item.message }}"
      loop: "{{ install_report }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Fail the run if any host in the batch failed
      tags: post-check, install
      run_once: true
      delegate_to: localhost
      vars:
        failed_hosts: "{{ install_report | selectattr('success', 'equalto', false) | list }}"
      ansible.builtin.fail:
        msg: >-
          {{ failed_hosts | length }} of {{ ansible_play_batch | length }} host(s)
          did not complete successfully: {{ failed_hosts }}
      when: failed_hosts | length > 0

