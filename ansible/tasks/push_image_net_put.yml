---
## The transfer mechanism, isolated so it can be swapped whole.
##
## Included by upgrade_iosxe.yml's staging block. The caller has already:
##   - asserted privilege 15
##   - asserted the image is not already in flash
##   - asserted there is enough free space
##   - captured the prior SCP server state and enabled the server
##
## and will restore the SCP server in its always: block regardless of what
## happens in here. Nothing in this file should assume it runs to
## completion.
##
## Contract this file must honour if it is replaced:
##   in   -- search_dir, target_image, target_image_sha512,
##           target_image_size, flash_dir
##   out  -- the image present in flash_dir and SHA-512 verified ON THE
##           DEVICE, or a task failure
##
## Alternative implementation, if net_put proves unusable: OpenSSH scp
## invoked inside the EE against a rendered known_hosts. See
## ansible/net_put_probe.yml and design doc 10.

- name: Push the image via net_put
  ansible.netcommon.net_put:
    src: "{{ search_dir }}/{{ target_image }}"
    dest: "{{ flash_dir }}{{ target_image }}"
    protocol: scp
  vars:
    ansible_command_timeout: 10000
  register: image_push

- name: Verify the pushed image on the device
  tags: image-validate, install
  cisco.ios.ios_command:
    commands:
      - "verify /sha512 {{ flash_dir }}{{ target_image }} {{ target_image_sha512 }}"
    wait_for:
      - "result[0] contains '{{ target_image_sha512 }}'"
  vars:
    ansible_command_timeout: 600
  register: image_validation_result

- name: Assert the device confirmed the expected digest
  tags: image-validate, install
  ansible.builtin.assert:
    quiet: false
    success_msg: 'Device confirmed SHA-512 {{ target_image_sha512 }} for {{ target_image }}.'
    fail_msg: >-
      Device output did not contain the expected SHA-512 digest for
      {{ target_image }}. Treat this as a failed verification -- do not
      proceed to install.
    that:
      - "target_image_sha512 in (image_validation_result.stdout[0] | default(''))"

- name: Print target image validation result
  tags: image-validate, install
  ansible.builtin.debug:
    msg: "{{ image_validation_result.stdout_lines[0][1] }}"
