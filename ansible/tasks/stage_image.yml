---
- name: Enable SCP if not already enabled
  when: staging_result is defined and staging_result.status != "skipped"
  block:
    - name: Read prior SCP server state
      tags: image-copy, enable-scp
      cisco.ios.ios_command:
        commands: 'show running-config | include ^ip scp server'
      register: scp_server_prior

    - name: Record whether the SCP server was already enabled
      tags: image-copy, enable-scp
      ansible.builtin.set_fact:
        scp_server_prior_enabled: "{{ 'ip scp server enable' in scp_server_prior.stdout[0] }}"

    - name: Enable the device SCP server
      tags: image-copy, enable-scp
      cisco.ios.ios_config:
        lines:
          - 'ip scp server enable'
      when: not scp_server_prior_enabled

  rescue:
    - name: Catch SCP enabling failures
      tags: image-copy, enable-scp
      ansible.builtin.set_fact:
        staging_result:
          success: false
          status: "not_copied"
          reason: "Failed to enable SCP"
          message: "{{ ansible_failed_reason.msg }}"

- name: Reset SSH connection
  ansible.builtin.meta: reset_connection

- name: Push image
  block:
    - name: Copy the image to host via SCP
      ansible.netcommon.net_put:
        src: "{{ software_registry.search_dir }}/{{ target_image }}"
        dest: "{{ target_image }}"
        protocol: scp
      vars:
       ansible_network_cli_ssh_type: paramiko
       ansible_command_timeout: 10000
      register: image_push

  rescue:
    - name: Catch SCP copy failures
      tags: post-check, image-copy
      ansible.builtin.set_fact:
        staging_result:
          success: False
          status: "not_copied"
          reason: "SCP copy task failed"
          message: "{{ ansible_failed_reason.msg }}"

- name: Verify the pushed image
  block:
    - name: Verify the pushed image on the device
      tags: image-validate, install
      cisco.ios.ios_command:
        commands:
          - "verify /sha512 {{ flash_dir }}{{ target_image }} {{ target_image_sha512 }}"
        wait_for:
          - "result[0] contains '{{ target_image_sha512 }}'"
      vars:
        ansible_command_timeout: 600
      register: image_validation_result

    - name: Assert the device confirmed the expected digest
      tags: image-validate
      ansible.builtin.assert:
        quiet: false
        success_msg: 'Device confirmed SHA-512 {{ target_image_sha512 }} for {{ target_image }}.'
        fail_msg: >-
          Device output did not contain the expected SHA-512 digest for
          {{ target_image }}. Treat this as a failed verification -- do not
          proceed to install.
        that:
          - "target_image_sha512 in (image_validation_result.stdout[0] | default(''))"

    - name: Print target image validation result
      tags: image-validate
      ansible.builtin.debug:
        msg: "{{ image_validation_result.stdout_lines[0][1] }}"

  rescue:
    - name: Catch verification errors
      tags: post-check, image-copy
      ansible.builtin.set_fact:
        staging_result:
          success: False
          status: "not_verified"
          reason: "Image checksum verification failed"
          message: "{{ ansible_failed_reason.msg }}"

    - name: Stop play for host
      ansible.builtin.meta: end_host

  always:
    - name: Restore SCP server to its prior state
      tags: image-copy, install
      cisco.ios.ios_config:
        lines:
          - "{{ 'ip scp server enable' if scp_server_prior_enabled | default(false) else 'no ip scp server enable' }}"
      register: scp_server_restore
      failed_when: false
      when: scp_server_prior_enabled is defined

    - name: Read back SCP server state
      tags: image-copy, install
      cisco.ios.ios_command:
        commands: 'show running-config | include ^ip scp server'
      register: scp_server_after
      failed_when: false
      when: scp_server_prior_enabled is defined

    - name: Record whether the restore was confirmed
      tags: image-copy, install
      ansible.builtin.set_fact:
        scp_restore_confirmed: >-
          {{ (scp_server_prior_enabled is not defined)
             or (('ip scp server enable' in (scp_server_after.stdout[0] | default('')))
                 == (scp_server_prior_enabled | bool)) }}

    - name: Warn loudly if the device was not put back
      tags: image-copy, install
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} SCP server state was NOT
          restored. This device has been changed and not changed back.
          Fix it by hand
      when: not (scp_restore_confirmed | bool)

- name: Record staging result for the batch summary
  tags: post-check, image-copy
  ansible.builtin.set_fact:
    staging_result:
      success: True
      status: "image_copied"
      reason: "Playbook finished successfully"
      message: "No message"
  when:
    - image_validation_result is not failed
    - image_push is not failed
    - scp_server_after is not failed

- name: Stop processing this host if staging failed or the device was not restored
  tags: image-copy
  ansible.builtin.meta: end_host
  when: not staging_result.success
