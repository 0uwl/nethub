---
## in  -- target_image, software_registry.search_dir
## out -- staging_result (on failure), scp_server_prior_enabled,
##        scp_restore_confirmed
##
## Writes the image with net_put over SCP, which needs the device's own SCP
## server listening -- the only device config this file changes. Bracketed:
## capture, enable if needed, restore in always:, confirm by re-reading the
## running-config, and fail the host if the restore is unconfirmed.
##
## Not covered: a killed process or crashed container never reaches always:.
##
## paramiko is deliberate -- libssh breaks the SSH connection at image size.

- name: Stage the image by pushing it to the device
  block:
    - name: Read prior SCP server state
      tags: image-copy, enable-scp
      cisco.ios.ios_command:
        commands: 'show running-config | include ^ip scp server'
      register: scp_server_prior

    - name: Record whether the SCP server was already enabled
      tags: image-copy, enable-scp
      ansible.builtin.set_fact:
        scp_server_prior_enabled: "{{ 'ip scp server enable' in scp_server_prior.stdout[0] }}"

    - name: Enable the device SCP server
      tags: image-copy, enable-scp
      cisco.ios.ios_config:
        lines:
          - 'ip scp server enable'
      when: not scp_server_prior_enabled

    - name: Reset SSH connection
      ansible.builtin.meta: reset_connection

    - name: Copy the image to host via SCP
      tags: image-copy
      ansible.netcommon.net_put:
        src: "{{ software_registry.search_dir }}/{{ target_image }}"
        dest: "{{ target_image }}"
        protocol: scp
      vars:
        ansible_network_cli_ssh_type: paramiko
        ansible_command_timeout: 10000
      register: image_push

  rescue:
    - name: Catch SCP push failures
      tags: post-check, image-copy
      ansible.builtin.set_fact:
        staging_result:
          success: false
          status: "not_copied"
          reason: "SCP push failed"
          message: "{{ ansible_failed_reason.msg | default('No message') }}"

    - name: Stop play for host
      ansible.builtin.meta: end_host

  always:
    - name: Restore SCP server to its prior state
      tags: image-copy, install
      cisco.ios.ios_config:
        lines:
          - "{{ 'ip scp server enable' if scp_server_prior_enabled | default(false) else 'no ip scp server enable' }}"
      register: scp_server_restore
      failed_when: false
      when: scp_server_prior_enabled is defined

    - name: Read back SCP server state
      tags: image-copy, install
      cisco.ios.ios_command:
        commands: 'show running-config | include ^ip scp server'
      register: scp_server_after
      failed_when: false
      when: scp_server_prior_enabled is defined

    - name: Record whether the restore was confirmed
      tags: image-copy, install
      ansible.builtin.set_fact:
        scp_restore_confirmed: >-
          {{ (scp_server_prior_enabled is not defined)
             or (('ip scp server enable' in (scp_server_after.stdout[0] | default('')))
                 == (scp_server_prior_enabled | bool)) }}

    - name: Fail the host if the device was not put back
      when: not (scp_restore_confirmed | bool)
      block:
        - name: Record the unconfirmed restore
          tags: image-copy, install
          ansible.builtin.set_fact:
            staging_result:
              success: false
              status: "scp_not_restored"
              reason: "SCP server state was not restored and could not be confirmed"
              message: >-
                {{ inventory_hostname }} has been changed and not changed back.
                Fix it by hand before saving configuration

        - name: Stop play for host
          tags: image-copy, install
          ansible.builtin.meta: end_host
