---
## in  -- software_bundle (inventory var), software_registry
## out -- target_bundle, target_image, target_image_sha512, target_version,
##        target_image_found, target_image_size, target_image_size_kb

- name: Assert software_bundle is defined
  tags: pre-check, check-version, install
  ansible.builtin.assert:
    quiet: false
    that:
      - software_bundle is defined
    fail_msg: >-
      No software_bundle defined for {{ inventory_hostname }} -- set it in inventory
      (host_vars or group_vars) to the software_registry entry to install

- name: Set target_bundle fact
  tags: pre-check, image-copy, install
  ansible.builtin.set_fact:
    target_bundle: "{{ software_registry[software_bundle] }}"

- name: Resolve target image from target_bundle
  tags: pre-check, check-version, install
  ansible.builtin.set_fact:
    target_image: "{{ target_bundle.file_name }}"
    target_image_sha512: "{{ target_bundle.sha512 }}"
    target_version: "{{ target_bundle.version }}"

- name: Measure the target image on the local file system
  tags: pre-check, disk-check, image-check, image-copy, install
  delegate_to: localhost
  connection: local  ## required for stat
  ansible.builtin.stat:
    path: "{{ software_registry.search_dir }}/{{ target_image }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: target_image_stat
  failed_when: false

- name: Record whether the target image is readable on the controller
  tags: pre-check, disk-check, image-check, image-copy, install
  ansible.builtin.set_fact:
    target_image_found: "{{ (target_image_stat.stat | default({})).exists | default(false) }}"

- name: Assert the target image size is knowable
  tags: pre-check, disk-check, image-check, image-copy, install
  ansible.builtin.assert:
    quiet: false
    success_msg: >-
      {{ target_image }} is
      {{ 'measured on the controller' if target_image_found | bool
         else 'not local; using the file_size declared in the registry' }}.
    fail_msg: >-
      Cannot determine the size of {{ target_image }}. It is not readable at
      {{ software_registry.search_dir }}/{{ target_image }} on the controller,
      and target_bundle declares no file_size either. Make the published tree
      readable here, or add file_size to the registry entry -- du -b <file>.
    that:
      - target_image_found | bool or 'file_size' in target_bundle

- name: Set target image size fact
  tags: pre-check, disk-check, image-check, image-copy, install
  ansible.builtin.set_fact:
    target_image_size: >-
      {{ target_image_stat.stat.size if target_image_found | bool
         else target_bundle.file_size }}

## Disagreement here means the published bytes are not the bytes the registry
## describes, which the device-side verify would only catch after the whole
## transfer has already run.
- name: Assert a declared file_size matches the bytes on the controller
  tags: pre-check, disk-check, image-check, image-copy, install
  when:
    - target_image_found | bool
    - "'file_size' in target_bundle"
  ansible.builtin.assert:
    quiet: false
    success_msg: 'Registry file_size matches the {{ target_image_size }} bytes on disk.'
    fail_msg: >-
      target_bundle declares file_size {{ target_bundle.file_size }} for
      {{ target_image }}, but the file on the controller is
      {{ target_image_stat.stat.size }} bytes. The registry and the published
      bytes disagree -- do not transfer until that is resolved.
    that:
      - target_bundle.file_size | int == target_image_stat.stat.size | int

- name: Set target image size fact in KB
  tags: pre-check, disk-check, image-check, image-copy, install
  ansible.builtin.set_fact:
    target_image_size_kb: "{{ (target_image_size | int / 1024) | round(0, 'ceil') | int }}"
