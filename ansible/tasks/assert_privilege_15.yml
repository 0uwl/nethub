---
## Fails the host outright unless the current session is privilege level 15.
## NetHub requires level-15 accounts at login (design doc §4.3) -- there is
## no `enable` escalation anywhere in this flow.
##
## in  -- nothing (uses the play's existing connection)
## out -- privilege_check registered, or a task failure

- name: Read current privilege level
  cisco.ios.ios_command:
    commands: 'show privilege'
  register: privilege_check

- name: Fail unless the session is privilege 15
  ansible.builtin.assert:
    quiet: false
    success_msg: 'Session is at privilege level 15.'
    fail_msg: >-
      Session is not at privilege level 15. NetHub requires
      level-15 accounts; grant this user level 15 at login rather
      than relying on enable escalation.
    that:
      - "'level is 15' in privilege_check.stdout[0]"
