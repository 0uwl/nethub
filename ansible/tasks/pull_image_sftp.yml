---
## in  -- distribution_host, distribution_user, software_registry.search_dir,
##        target_image, flash_dir; distribution_password from the execution's
##        vars, or DISTRIBUTION_PASSWORD for a hand run
## out -- staging_result (on failure)
- name: Stage the image by having the device pull it
  vars:
    _distribution_password: >-
      {{ distribution_password
         | default(lookup('ansible.builtin.env', 'DISTRIBUTION_PASSWORD'), true) }}
  block:
    - name: Assert the pull transport is configured
      tags: pre-check, image-copy
      ansible.builtin.assert:
        quiet: false
        success_msg: 'Pulling {{ target_image }} from {{ distribution_host }}.'
        fail_msg: >-
          The pull_sftp transport needs distribution_host, distribution_user
          and a distribution password. Export DISTRIBUTION_PASSWORD
          rather than passing -e, which would put the password in this
          process's command line.
        that:
          - distribution_host is defined and distribution_host | length > 0
          - distribution_user is defined and distribution_user | length > 0
          - _distribution_password | length > 0

    - name: Copy the image to host via SFTP
      tags: image-copy
      ansible.netcommon.cli_command:
        command: >-
          copy
          sftp://{{ distribution_user }}@{{ distribution_host }}{{ software_registry.search_dir }}/{{ target_image }}
          {{ flash_dir }}
        prompt:
          - '[Dd]estination filename'
          - '[Pp]assword:'
        answer:
          - "{{ target_image }}"
          - "{{ _distribution_password }}"
        check_all: true
      vars:
        ansible_command_timeout: 10000
      no_log: true
      register: image_pull

  rescue:
    - name: Catch SFTP pull failures
      tags: post-check, image-copy
      ansible.builtin.set_fact:
        staging_result:
          success: false
          status: "not_copied"
          reason: "SFTP pull failed"
          message: "{{ ansible_failed_reason.msg | default('No message') }}"

    - name: Stop play for host
      ansible.builtin.meta: end_host
