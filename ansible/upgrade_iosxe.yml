---
## Runs first, ungathered and unbatched (no serial limit), so the full
## upgrade plan for every targeted host can be printed in one pass before
## the main play below starts connecting to devices and making changes.
## software_bundle is a plain inventory var, so this needs no facts/connection.
- name: IOSXE Upgrade Plan Preview
  hosts: upgrade_batch
  gather_facts: false
  tasks:
    - name: Resolve target bundle for {{ inventory_hostname }}
      tags: pre-check, check-version, install
      ansible.builtin.include_tasks: tasks/resolve_target_bundle.yml

    - name: Print upgrade plan for all targeted hosts
      tags: pre-check, install
      run_once: true  # noqa: run-once[task] -- this play has no serial, so it always covers every targeted host in one pass
      delegate_to: localhost
      ansible.builtin.debug:
        msg: >-
          {{ item }} -> target version
          {{ hostvars[item].target_bundle.version | default('UNDEFINED (set software_bundle for this host)') }},
          image {{ hostvars[item].target_bundle.filename | default('UNDEFINED') }}
      loop: "{{ ansible_play_hosts_all }}"
      loop_control:
        label: "{{ item }}"

    - name: Continue with upgrade process?
      tags: image-copy, install
      ansible.builtin.pause:
        prompt: "[{{ inventory_hostname }}] Press enter to continue or ctrl-c + a to abort"

- name: IOSXE Image Staging
  hosts: upgrade_batch
  gather_facts: false
  connection: network_cli

  # Tested on Cat9K

  # NOTE: You may need to increase copy image timeouts, please test manually before run this playbook

  ## Staging (the SCP push) is the slow part, so it gets its own serial,
  ## independent of the activation play below. Defaults to upgrade_serial
  ## (and from there to 1) so a caller who only ever sets upgrade_serial
  ## sees no change in behaviour; pass -e upgrade_stage_serial=N to widen
  ## just this play, e.g. upgrade_stage_serial=10 upgrade_serial=1 pushes
  ## to 10 hosts at once but still activates one at a time.
  ##
  ## Note: with N > 1, hosts in the same wave share this terminal's stdin,
  ## so the "enable SCP server?" pause in tasks/stage_image.yml can
  ## interleave across them -- same caveat the activation play's serial
  ## has always carried.
  ##
  ## any_errors_fatal/max_fail_percentage are intentionally left unset:
  ## a host that fails is dropped from the rest of its wave but does not
  ## block other hosts in that wave or later waves.
  serial: "{{ upgrade_stage_serial | default(upgrade_serial) | default(1) }}"

  tasks:
    - name: Gather and print basic IOS XE facts
      ansible.builtin.import_role:
        name: iosxe_facts
      vars:
        iosxe_facts_flash_dir: "{{ flash_dir }}"

    - name: Assert session is at privilege level 15
      tags: pre-check, install
      ansible.builtin.include_tasks: tasks/assert_privilege_15.yml

    - name: Set upgrade timestamp
      tags: backup, install
      ansible.builtin.set_fact:
        timestamp: "{{ lookup('pipe', 'date \"+%Y-%m-%d-%H-%M\"') }}"

    ## Configuration backup
    - name: Config Backup for {{ inventory_hostname }}
      tags: backup, install
      cisco.ios.ios_config:
        backup: true
        backup_options:
          filename: "{{ inventory_hostname }}_backup_{{ timestamp }}.cfg"
          dir_path: ./backup
      register: config_output

    ## Display message for pre-check begins
    - name: Starting pre-checks...
      ansible.builtin.debug:
        msg: "Starting pre-checks ..."
      tags: pre-check, install

    ## Set IOSXE Version as variable via set fact
    - name: Set fact for the current IOSXE version
      tags: pre-check, check-version, post-check, install
      ansible.builtin.set_fact:
        current_version: "{{ ansible_facts['net_version'] }}"

    - name: Print parsed output for the current IOSXE version
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} currently running with {{ current_version }}"

    - name: Resolve target bundle for {{ inventory_hostname }}
      tags: pre-check, check-version, image-check, image-copy, install
      ansible.builtin.include_tasks: tasks/resolve_target_bundle.yml

    - name: Initialize upgrade result tracking
      tags: pre-check, check-version, post-check, install
      ansible.builtin.set_fact:
        upgrade_result:
          status: not_started
          current_version: "{{ current_version }}"
          target_version: "{{ target_version }}"

    - name: Assert that switch is NOT running with the target IOSXE version
      tags: pre-check, check-version, install
      ansible.builtin.assert:
        that:
          - "current_version != target_version"
        quiet: false
        success_msg: "{{ inventory_hostname }} not running target verion {{ target_version }}, current version is {{ current_version }}"
        fail_msg: "{{ inventory_hostname }} already running {{ target_version }}"

    - name: Check available disk space for {{ inventory_hostname }}
      tags: pre-check, disk_check, image-check, image-copy, install
      ansible.builtin.include_tasks: tasks/check_disk_space.yml

    - name: Stage target image on {{ inventory_hostname }}
      tags: image-copy, install
      ansible.builtin.include_tasks: tasks/stage_image.yml

## Separate play so activation keeps its own serial pacing (default 1)
## regardless of how wide thestaging play above ran
- name: IOSXE Image Activation
  hosts: upgrade_batch
  gather_facts: false
  connection: network_cli
  serial: "{{ upgrade_serial | default(1) }}"
  tasks:
    - name: Activate target image on {{ inventory_hostname }}
      tags: install, upgrade
      ansible.builtin.include_tasks: tasks/activate_image.yml

## Runs once, after all serial waves of the play above have finished, so
## it can report on every targeted host regardless of how many waves
## upgrade_serial split them into (a run_once task inside the play above
## would only see the current wave).
- name: IOSXE Upgrade Summary
  hosts: upgrade_batch
  gather_facts: false
  tasks:
    - name: Report batch upgrade summary
      ansible.builtin.import_role:
        name: batch_summary
