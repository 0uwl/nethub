## RENDERED BY NETHUB -- DO NOT EDIT.
##
## Written into the per-job private_data_dir at dispatch, compiled from a
## validated upgrade request plus the artifacts table. Regenerated for
## every job, never carried between runs, discarded with the job's
## private_data_dir (7.4).
##
## Contains only the hosts in THIS run -- 8 specifies "a minimal per-job
## ... inventory rather than the full fleet inventory". NetHub keeps no
## master fleet inventory at all; holding one would make it an inventory
## manager, which 2 says it isn't. Hosts arrive with a request and leave
## with the job.
##
## The `{{ image_registry[...] }}` indirection below is NetHub's own
## template output, not user input -- the request carried a bare key.
all:
  children:
    iosxe:
      hosts:
        test-switch:
          ansible_host: 192.168.1.142
          image_bundle: "{{ image_registry['17.12.06_lite'] }}"
          flash_dir: 'flash:'

        test-switch-2:
          ansible_host: 192.168.1.143
          image_bundle: "{{ image_registry['17.12.08_lite'] }}"
          flash_dir: 'bootflash:'
