ansible_network_os: cisco.ios.ios

## Distribution host, and the service account the DEVICE uses to pull its
## image from it.
##
## This is machine-to-machine: the switch opens the SCP session, not a
## human. 4 calls this credential "the access-control gate on who can
## pull an image", which is an authorization decision about the image
## store, not about a person -- so it stays a shared, vaulted account.
##
## Kept deliberately separate from `ansible_user` in group_vars/all.yml.
## The original example reused ansible_user for both, which breaks the
## moment ansible_user becomes a human's RADIUS name: the distribution
## host would need a local account per engineer.
scp_server: 192.168.1.15
scp_user: nethub-dist
scp_pass: "{{ vault_scp_pass }}"

