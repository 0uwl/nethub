## There is no distribution account and no dist_* vars at all (4.3.1).
##
## NetHub now PUSHES the image to the device over the same network_cli
## session ansible_user already authenticates -- the device's own SCP
## server, toggled on for the stage phase and restored after (see the
## comment in group_vars/all.yml for why ansible_user carries no second
## meaning here). There is no second account for NetHub to define, no
## second password to mint or expire, and nothing for a vault to hold.
##
## This is a real simplification versus the earlier pull design, not a
## renamed version of it: the SSH/SFTP distribution daemon, its chrooted
## service account, and the per-phase password-minting mechanism this
## file used to document are gone, not replaced.

