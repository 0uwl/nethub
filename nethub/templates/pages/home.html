{% extends 'layouts/main.html' %}
{% block title %}NetHub{% endblock %}
{% block content %}

<div class="page-header">
  <h1>NetHub</h1>
</div>
{% if current_user.is_authenticated %}
<p class="lead"><a href="{{ url_for('registries.list_registries') }}">Go to the registries</a></p>
{% else %}
<p class="lead"><a href="{{ url_for('auth.login') }}">Log in</a> to manage the software registry.</p>
{% endif %}

{% endblock %}
