{% extends 'layouts/main.html' %}
{% block title %}Add Registry Entry{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Add Registry Entry</h1>
</div>

<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" class="form-control" id="name" name="name" value="{{ name }}" required>
  </div>

  <div class="form-group">
    <label for="sha512">SHA-512 checksum</label>
    <input type="text" class="form-control" id="sha512" name="sha512" value="{{ sha512 }}" required>
  </div>

  <div class="form-group">
    <label for="image">Image file</label>
    <input type="file" id="image" name="image" required>
  </div>

  <button type="submit" class="btn btn-primary">Upload</button>
  <a href="{{ url_for('registry.list_entries') }}" class="btn btn-default">Cancel</a>
</form>

{% endblock %}
