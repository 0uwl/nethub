name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned. Unpinned, this job can fail on an unchanged codebase: ruff
      # 0.16 widened its DEFAULT rule set to include isort and part of
      # pylint/flake8-simplify, which broke lint on three branches that had
      # passed locally against 0.15. A linter that changes what it enforces
      # without a commit is a linter that blocks merges at random, so bumping
      # these is a deliberate change with its own diff -- the same reason
      # requirements.txt is pinned.
      - run: pip install ruff==0.16.7 yamllint==1.38.0
      - name: Ruff (Python)
        run: ruff check .
      - name: yamllint
        run: yamllint .
      # Containerfile.dev is dev-only, deliberately incomplete (no COPY of
      # app code -- see its own header comment) and never used in
      # production, so it's not linted against the production preset --
      # same exclusion Drawbridge applies to its own dev image.
      - name: Containerfile linting
        uses: immanuwell/dockerfile-roast@1.4.4
        with:
          files: 'Containerfile'
          engine: podman
          preset: production

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -v

  publish:
    name: Publish container
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # linux/arm64 covers e.g. a 64-bit Raspberry Pi host; QEMU
      # (setup-qemu-action) emulates it since this runner is amd64.
      # cache-from/to: type=gha caches build layers in the Actions cache
      # and reuses whatever's still valid on the next run.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha,scope=nethub
          cache-to: type=gha,scope=nethub,mode=max
